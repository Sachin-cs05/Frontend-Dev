<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Image Filter Comparison</h1>
        <div class="comparison-container">
            <div class="image-container">
                <img src="https://picsum.photos/500/300?random=1" alt="Original Image">
                <p class="caption">Original Image</p>
            </div>
            <div class="image-container">
                <img src="https://picsum.photos/500/300?random=1" alt="Filtered Image" class="filtered-image">
                <p class="caption">Brightness Filter Applied</p>
            </div>
        </div>
    </div>
</body>
</html>
