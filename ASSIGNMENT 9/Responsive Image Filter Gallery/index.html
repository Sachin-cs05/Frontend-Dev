<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery-container">
        <h1>Image Filter Gallery</h1>
        <div class="image-grid">
            <div class="image-item">
                <img src="https://picsum.photos/300/200?random=1" alt="Image 1" class="filter-blur">
                <p class="caption">Blur Effect</p>
            </div>
            <div class="image-item">
                <img src="https://picsum.photos/300/200?random=2" alt="Image 2" class="filter-grayscale">
                <p class="caption">Grayscale Effect</p>
            </div>
            <div class="image-item">
                <img src="https://picsum.photos/300/200?random=3" alt="Image 3" class="filter-sepia">
                <p class="caption">Sepia Effect</p>
            </div>
            <div class="image-item">
                <img src="https://picsum.photos/300/200?random=4" alt="Image 4" class="filter-brightness">
                <p class="caption">Brightness Effect</p>
            </div>
            <div class="image-item">
                <img src="https://picsum.photos/300/200?random=5" alt="Image 5" class="filter-contrast">
                <p class="caption">Contrast Effect</p>
            </div>
            <div class="image-item">
                <img src="https://picsum.photos/300/200?random=6" alt="Image 6" class="filter-hue-rotate">
                <p class="caption">Hue Rotate Effect</p>
            </div>
        </div>
    </div>
</body>
</html>
