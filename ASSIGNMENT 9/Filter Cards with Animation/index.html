<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Profile Cards with Filter Effects</h1>
        <div class="cards-container">
            <div class="profile-card">
                <img src="https://picsum.photos/200/200?random=1" alt="Profile 1">
                <h2>John Doe</h2>
                <p>Web Developer</p>
            </div>
            <div class="profile-card">
                <img src="https://picsum.photos/200/200?random=2" alt="Profile 2">
                <h2>Jane Smith</h2>
                <p>UI Designer</p>
            </div>
            <div class="profile-card">
                <img src="https://picsum.photos/200/200?random=3" alt="Profile 3">
                <h2>Mike Johnson</h2>
                <p>Product Manager</p>
            </div>
        </div>
    </div>
</body>
</html>
