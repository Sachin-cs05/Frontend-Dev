<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
</head>
<body>
    <form action="#" post = "post">
        <label for="name">Cardholder Name : 
            <input type="text" name="name" id="name" placeholder="Enter cardholder name" required>
        </label>
        <br>
        <br>
        <label for="cardNumber">CardNumber :
            <input type="text" name="cardnumber" id="cardnumber" placeholder="Enter cardnumber" required>
        </label>
        <br>
        <br>
        <label for="expiry"> Expiry Date : 
            <input type="month" name="expiry" id="expiry" required>
        </label>
        <br><br>
        <label for="cvv">CVV : 
            <input type="text" name="cvv" id="cvv" placeholder="Enter CVV" required>
        </label>
        <br><br>
        <button type="submit"> Pay Now</button>
    </form>
</body>
</html>
