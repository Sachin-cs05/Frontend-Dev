<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML entities</title>
</head>
<body>
    <h1>HTML Entities Demo</h1>
    <p>
        Less than: &lt;, Greater than: &gt;, Ampersand: &amp;, Double quote: &quot;, Single quote: &#39;.
    </p>
    <p>
        Symbols: &copy; &nbsp; &trade; &nbsp; &reg;
    </p>
</body>
</html>
