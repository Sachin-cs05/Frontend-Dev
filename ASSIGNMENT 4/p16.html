<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URI Encoding Example</title>
</head>
<body>
    <h2>URI Encoding Demonstration</h2>

    <p><strong>Unencoded URL :</strong></p>

    <p>
        <a href="https://example.com/search?query=HTML & CSS">
            https://example.com/search?query=HTML & CSS
        </a>
    </p>

    <p><strong>Encoded URL : </strong></p>
    <p>
        <a href="https://example.com/search?query=HTML%20%26%20CSS">
            https://example.com/search?query=HTML%20%26%20CSS
        </a>
    </p>

    <p>
        in the encoded version :
        <ul>
            <li><code>%20</code> replace space</li>
            <li><code>%26</code> replace the ampersand (&)</li>
        </ul>
    </p>
</body>
</html>
