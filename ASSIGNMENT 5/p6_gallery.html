<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="p6_gallery.css">
</head>
<body>

  <header>
    <h1>Beautiful Destinations Gallery</h1>
  </header>

  <main class="gallery">
    <div class="photo">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Beach">
      <div class="caption">Sunny Beach</div>
    </div>
    <div class="photo">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" alt="Mountains">
      <div class="caption">Majestic Mountains</div>
    </div>
    <div class="photo">
      <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d" alt="City">
      <div class="caption">City Lights</div>
    </div>
    <div class="photo">
      <img src="https://images.unsplash.com/photo-1470770903676-69b98201ea1c" alt="Forest">
      <div class="caption">Peaceful Forest</div>
    </div>
    <div class="photo">
      <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e" alt="Desert">
      <div class="caption">Golden Desert</div>
    </div>
    <div class="photo">
      <img src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa" alt="Lake">
      <div class="caption">Crystal Lake</div>
    </div>
  </main>

  <footer>
    <p>© 2025 Sachin Saini | All Rights Reserved</p>
  </footer>

</body>
</html>
