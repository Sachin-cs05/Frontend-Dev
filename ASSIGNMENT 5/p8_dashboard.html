<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Layout</title>
  <link rel="stylesheet" href="p8_dashboard.css">
</head>
<body>

  <!-- Fixed Header -->
  <header class="header">
    <h1>My Dashboard</h1>
  </header>

  <!-- Dashboard Wrapper -->
  <div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
      <nav>
        <ul>
          <li><a href="#">Overview</a></li>
          <li><a href="#">Analytics</a></li>
          <li><a href="#">Reports</a></li>
          <li><a href="#">Settings</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="content">
      <section class="card">
        <h2>Statistics</h2>
        <p>Here you can see an overview of your recent performance metrics and key data insights.</p>
      </section>

      <section class="card">
        <h2>Recent Activity</h2>
        <p>Latest updates, user interactions, and system notifications will appear here.</p>
      </section>
    </main>

  </div>

</body>
</html>
