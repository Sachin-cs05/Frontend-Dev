<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Components Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>User Interface Components</h1>
    </header>
    
    <main>
        <section class="ui-container">
            <div class="card">
                <h2>Search Components</h2>
                
                <div class="search-bar-container">
                    <input type="text" class="search-bar" placeholder="Search...">
                    <button class="search-button">Search</button>
                </div>
                
                <div class="component-group">
                    <h3>Buttons</h3>
                    <button class="ui-button primary">Primary Button</button>
                    <button class="ui-button secondary">Secondary Button</button>
                    <button class="ui-button accent">Accent Button</button>
                </div>
                
                <div class="component-group">
                    <h3>Dropdown Menu</h3>
                    <select class="dropdown">
                        <option>Select an option</option>
                        <option>Option 1</option>
                        <option>Option 2</option>
                        <option>Option 3</option>
                        <option>Option 4</option>
                    </select>
                </div>
                
                <div class="component-group">
                    <h3>Form Elements</h3>
                    <form class="sample-form">
                        <input type="text" class="form-input" placeholder="Enter your name">
                        <input type="email" class="form-input" placeholder="Enter your email">
                        <textarea class="form-textarea" placeholder="Enter your message"></textarea>
                        <button type="submit" class="ui-button primary">Submit</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    
    <footer>
        <p>UI Components with CSS Styling</p>
    </footer>
</body>
</html>
