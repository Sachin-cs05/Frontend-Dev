<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CSS Animation Demonstration</h1>
    </header>
    
    <main>
        <section class="animation-container">
            <h2>Bouncing Ball Animation</h2>
            <div class="ball-animation">
                <div class="ball"></div>
            </div>
        </section>
        
        <section class="animation-container">
            <h2>Color Changing Text</h2>
            <div class="color-text">
                <h3 class="animated-text">Animated Text</h3>
            </div>
        </section>
        
        <section class="animation-container">
            <h2>Moving Box Animation</h2>
            <div class="moving-box-container">
                <div class="moving-box"></div>
            </div>
        </section>
    </main>
    
    <footer>
        <p>CSS Animations with @keyframes</p>
    </footer>
</body>
</html>
