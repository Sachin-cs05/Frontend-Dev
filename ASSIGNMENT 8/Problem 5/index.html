<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Styled Button Collection</h1>
    </header>
    
    <main>
        <section class="button-section">
            <h2>Primary Buttons</h2>
            <button class="btn primary">Primary Button</button>
            <button class="btn primary" disabled>Disabled Primary</button>
        </section>
        
        <section class="button-section">
            <h2>Secondary Buttons</h2>
            <button class="btn secondary">Secondary Button</button>
            <button class="btn secondary" disabled>Disabled Secondary</button>
        </section>
        
        <section class="button-section">
            <h2>Outline Buttons</h2>
            <button class="btn outline">Outline Button</button>
            <button class="btn outline" disabled>Disabled Outline</button>
        </section>
        
        <section class="button-section">
            <h2>Special Buttons</h2>
            <button class="btn success">Success Button</button>
            <button class="btn warning">Warning Button</button>
            <button class="btn danger">Danger Button</button>
        </section>
        
        <section class="button-section">
            <h2>Button Sizes</h2>
            <button class="btn primary small">Small Button</button>
            <button class="btn primary">Default Button</button>
            <button class="btn primary large">Large Button</button>
        </section>
    </main>
    
    <footer>
        <p>Button Collection with CSS Styles</p>
    </footer>
</body>
</html>
