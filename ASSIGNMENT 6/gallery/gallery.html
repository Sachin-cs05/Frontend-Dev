<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <div class="gallery-container">
        <h1>My Photo Gallery</h1>
        <div class="photo-grid">
            <figure class="photo-item">
                <img src="https://via.placeholder.com/300x200/FF6B6B/FFFFFF?text=Image+1" alt="Mountain Landscape">
                <figcaption>Mountain Landscape</figcaption>
            </figure>
            <figure class="photo-item">
                <img src="https://via.placeholder.com/300x200/4ECDC4/FFFFFF?text=Image+2" alt="Ocean View">
                <figcaption>Ocean View</figcaption>
            </figure>
            <figure class="photo-item">
                <img src="https://via.placeholder.com/300x200/45B7D1/FFFFFF?text=Image+3" alt="Forest Path">
                <figcaption>Forest Path</figcaption>
            </figure>
            <figure class="photo-item">
                <img src="https://via.placeholder.com/300x200/96CEB4/FFFFFF?text=Image+4" alt="City Skyline">
                <figcaption>City Skyline</figcaption>
            </figure>
            <figure class="photo-item">
                <img src="https://via.placeholder.com/300x200/FFEAA7/333333?text=Image+5" alt="Desert Dunes">
                <figcaption>Desert Dunes</figcaption>
            </figure>
            <figure class="photo-item">
                <img src="https://via.placeholder.com/300x200/DDA0DD/FFFFFF?text=Image+6" alt="Flower Garden">
                <figcaption>Flower Garden</figcaption>
            </figure>
            <figure class="photo-item">
                <img src="https://via.placeholder.com/300x200/98D8C8/FFFFFF?text=Image+7" alt="Northern Lights">
                <figcaption>Northern Lights</figcaption>
            </figure>
            <figure class="photo-item">
                <img src="https://via.placeholder.com/300x200/F7DC6F/333333?text=Image+8" alt="Sunset">
                <figcaption>Sunset</figcaption>
            </figure>
        </div>
    </div>
</body>
</html>
