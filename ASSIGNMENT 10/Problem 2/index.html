<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <!-- Header with name and tagline -->
    <header class="container-fluid bg-dark text-white py-4 text-center">
        <div class="container">
            <h1 class="display-4">John Doe</h1>
            <p class="lead">Web Developer & UI/UX Designer</p>
        </div>
    </header>

    <!-- Main content -->
    <main class="container mt-5">
        <div class="row">
            <div class="col-12 text-center mb-4">
                <!-- Profile image with Bootstrap classes -->
                <img src="https://via.placeholder.com/200" alt="Profile Photo" class="img-fluid rounded-circle mb-3" width="200" height="200">
                <h2 class="fw-bold">About Me</h2>
                <p class="mt-3">I'm a passionate web developer with 5 years of experience creating responsive and user-friendly websites using modern technologies.</p>
                
                <!-- Buttons -->
                <div class="mt-4">
                    <button class="btn btn-primary btn-lg me-3">Hire Me</button>
                    <button class="btn btn-outline-secondary btn-lg">Download CV</button>
                </div>
            </div>
        </div>

        <!-- Contact form -->
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <h3 class="text-center mb-4">Get In Touch</h3>
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Your Name">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Your Email">
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" rows="4" placeholder="Your Message"></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-success">Send Message</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="container-fluid bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p>&copy; 2025 John Doe. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
