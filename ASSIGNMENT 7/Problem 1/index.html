<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Borders and Padding Demonstration</h1>
    
    <div class="container">
        <div class="box solid-border">
            <p>Solid Border</p>
        </div>
        
        <div class="box dashed-border">
            <p>Dashed Border</p>
        </div>
        
        <div class="box double-border">
            <p>Double Border</p>
        </div>
        
        <div class="box groove-border">
            <p>Groove Border</p>
        </div>
        
        <div class="box rounded-corners">
            <p>Rounded Corners</p>
        </div>
    </div>
</body>
</html>
