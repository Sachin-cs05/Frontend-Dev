<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS Transformations Showcase</h1>
    
    <div class="container">
        <div class="box rotate-box">
            <p>Rotate Transformation</p>
        </div>
        
        <div class="box scale-box">
            <p>Scale Transformation</p>
        </div>
        
        <div class="box translate-box">
            <p>Translate Transformation</p>
        </div>
        
        <div class="box skew-box">
            <p>Skew Transformation</p>
        </div>
    </div>
    
    <div class="description">
        <p>Hover over each box to see the transformation effect. All transformations use a smooth transition.</p>
    </div>
</body>
</html>
