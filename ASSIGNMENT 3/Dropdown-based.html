<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Selection Page</title>
</head>
<body>

    <h1>Travel Selection Form</h1>

    <form>

        <label for="country">Select Country:</label>
        <select id="country" name="country">
            <option selected>India</option>
            <option>USA</option>
            <option>Japan</option>
            <option>France</option>
        </select>
        <br><br>

        <label for="state">Select State:</label>
        <select id="state" name="state">
            <option selected>Uttar Pradesh</option>
            <option>Rajasthan</option>
            <option>Maharashtra</option>
            <option>Kerala</option>
        </select>
        <br><br>

        <label for="city">Select City:</label>
        <select id="city" name="city">
            <option selected>Mathura</option>
            <option>Jaipur</option>
            <option>Mumbai</option>
            <option>Kochi</option>
        </select>
        <br><br>

        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option selected>Taj Mahal</option>
            <option>Gateway of India</option>
            <option>Red Fort</option>
            <option>Hawa Mahal</option>
        </select>
        <br><br>

        <p><strong>Your Selection Summary:</strong>  
        You are from <em>Mathura, Uttar Pradesh (India)</em> and your favorite tourist place is <em>Taj Mahal</em>.</p>

    </form>

</body>
</html>
